steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/cloudrun/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/akretic/akretic-demo:latest
images:
  - ${_IMAGE}
